<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Flood Risk Map</title>
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin=""
    />
    <style>
      :root {
        color-scheme: light;
        --bg: #f5f8fb;
        --panel: #ffffff;
        --text: #10243f;
        --muted: #516173;
        --high: #d62828;
        --medium: #f77f00;
        --low: #2a9d8f;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        background: radial-gradient(circle at 20% 10%, #e9f4ff, var(--bg));
        color: var(--text);
      }

      .layout {
        display: grid;
        grid-template-rows: auto 1fr;
        min-height: 100vh;
      }

      .header {
        padding: 14px 18px;
        background: var(--panel);
        border-bottom: 1px solid #d8e2ef;
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
      }

      .title {
        margin: 0;
        font-size: 1.05rem;
        font-weight: 700;
      }

      .status {
        color: var(--muted);
        font-size: 0.9rem;
      }

      #map {
        position: relative;
        width: 100%;
        height: calc(100vh - 64px);
        border-top: 1px solid #d8e2ef;
      }

      .legend {
        position: absolute;
        right: 20px;
        bottom: 20px;
        z-index: 1000;
        background: #fff;
        padding: 10px;
        border-radius: 8px;
        box-shadow: 0 8px 18px rgba(16, 36, 63, 0.16);
        font-size: 0.84rem;
        line-height: 1.6;
      }

      .swatch {
        display: inline-block;
        width: 12px;
        height: 12px;
        border-radius: 3px;
        margin-right: 6px;
      }
    </style>
  </head>
  <body>
    <div class="layout">
      <header class="header">
        <h1 class="title">Live Flood Risk (GloFAS)</h1>
        <div id="status" class="status">Loading data...</div>
      </header>
      <main id="map" aria-label="Flood risk map">
        <div class="legend">
          <div><span class="swatch" style="background:#d62828"></span>High</div>
          <div><span class="swatch" style="background:#f77f00"></span>Medium</div>
          <div><span class="swatch" style="background:#2a9d8f"></span>Low</div>
        </div>
      </main>
    </div>

    <script
      src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
      integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
      crossorigin=""
    ></script>
    <script>
      const statusEl = document.getElementById("status");

      const map = L.map("map", {
        zoomControl: true,
        minZoom: 2,
      }).setView([20, 0], 2);

      const tiles = L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
        maxZoom: 19,
        attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
      });

      tiles.on("tileerror", () => {
        statusEl.textContent = "Base map tiles failed to load; polygons may still display";
      });

      tiles.addTo(map);

      function colorFor(feature) {
        const level = feature.properties?.risk_level;
        const colors = { high: "#d62828", medium: "#f77f00", low: "#2a9d8f" };
        return colors[level] || "#22577a";
      }

      function resolveGeoJsonUrl() {
        const params = new URLSearchParams(window.location.search);
        const apiBase = params.get("api_base");

        if (apiBase) {
          return new URL("/geojson/live", apiBase).toString();
        }

        if (window.location.protocol === "file:") {
          return "http://127.0.0.1:8000/geojson/live";
        }

        return new URL("/geojson/live", window.location.origin).toString();
      }

      function onEachFeature(feature, layer) {
        const p = feature.properties || {};
        layer.bindTooltip(
          `Risk: ${p.risk_level ?? "n/a"} | Score: ${Number(p.risk_score ?? 0).toFixed(2)} | Discharge: ${Number(
            p.discharge ?? 0,
          ).toFixed(1)}`,
          { sticky: true },
        );
      }

      async function loadLayer() {
        const geojsonUrl = resolveGeoJsonUrl();
        try {
          const response = await fetch(geojsonUrl);
          if (!response.ok) {
            throw new Error(`HTTP ${response.status}`);
          }

          const data = await response.json();
          const features = data.features || [];
          if (features.length === 0) {
            statusEl.textContent = "No risk zones found in dataset";
            return;
          }

          const geoLayer = L.geoJSON(data, {
            style: (feature) => {
              const color = colorFor(feature);
              return {
                color,
                weight: 1,
                fillColor: color,
                fillOpacity: 0.4,
              };
            },
            onEachFeature,
          }).addTo(map);

          const bounds = geoLayer.getBounds();
          if (bounds.isValid()) {
            map.fitBounds(bounds.pad(0.2));
          }

          statusEl.textContent = `Loaded ${features.length} risk zones`;
        } catch (error) {
          statusEl.textContent = `Failed to load map data from ${geojsonUrl}: ${error.message}`;
        }
      }

      loadLayer();
    </script>
  </body>
</html>
